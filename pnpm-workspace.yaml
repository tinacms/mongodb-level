# pnpm 11 disables postinstall scripts of dependencies by default (strictDepBuilds).
# Allow only the deps that actually need their build step.
#   - esbuild: downloads the platform binary (transitive via @tinacms/scripts)
#   - mongodb-memory-server: downloads the MongoDB binary used by @shelf/jest-mongodb tests
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
